[project]
name = "python-basics-and-fast-api-concepts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hannibal-the-cannibal", email = "shreeshbhardwaj@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.1",
    "langchain-openai>=1.8.0",
    "langchain-openrouter>=0.2.9",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "markdown>=3.11.3",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "pypdf>=6.9.1,<7",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "truststore>=0.10.5",
    "unstructured[pdf]>=0.27.37",
]

[project.scripts]
python-basics-and-fast-api-concepts = "python_basics_and_fast_api_concepts:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
